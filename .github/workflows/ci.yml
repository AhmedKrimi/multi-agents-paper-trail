name: CI
on:
    push: 
        branches: ["main"]
    pull_request:
        branches: ["main"]
    
permissions: 
    contents: read
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v7
              with:
                python-version: '3.11'
            - name: Install project dependencies
              run: python -m pip install -e ".[dev]"
            - name: run not e2e tests
              run: python -m pytest -m "not e2e"
            - name: Lint source and tests
              run: ruff check --output-format=github src tests

